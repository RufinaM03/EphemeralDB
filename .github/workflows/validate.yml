name: Validate database runtime and console
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: benchmark
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[console,dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q
        env:
          RUN_POSTGRES_TESTS: '1'
          AURORA_DSN: postgresql://benchmark:test-only@127.0.0.1:5432/benchmark
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK from its official repository
        run: |
          git clone --depth 1 --branch 3.38.3 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - run: flutter build web --release --no-wasm-dry-run --pwa-strategy=none
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: frontend/build/web
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
