apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-ingress
  namespace: ephemeraldb
spec:
  podSelector:
    matchLabels:
      app: ephemeraldb-runtime
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ephemeraldb
      ports:
        - protocol: TCP
          port: 8765
