[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeraldb-benchmark"
version = "0.1.0"
description = "Phase 0 architecture and correctness specification for an ephemeral database benchmark."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "EphemeralDB Benchmark contributors" }]
dependencies = [
    "boto3>=1.43",
    "botocore>=1.43",
]

[project.scripts]
ephemeraldb-console = "ephemeraldb.console.app:main"

[project.optional-dependencies]
console = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psycopg[binary,pool]>=3.2,<4"]
dev = [
    "fastapi>=0.115,<1",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "postgres: explicitly enabled PostgreSQL baseline integration checks",
    "scale: optional larger dataset generation checks",
    "workload_scale: optional larger workload generation checks",
    "aws: real AWS integration tests; skipped unless RUN_AWS_TESTS=1 and required S3 buckets are configured",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
strict = true
warn_unreachable = true
warn_unused_configs = true
